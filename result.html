<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Г</div>
      <div>
        <strong>ГРАНТ</strong>
        <span>Демонстрационный портал</span>
  <main class="result-container">
    <div class="result-card">
      <div class="result-icon">!</div>
      <p class="eyebrow">РЕЗУЛЬТАТ РАССМОТРЕНИЯ</p>
      <h1>В гранте отказано</h1>
      <p class="result-lead">По итогам рассмотрения заявка не получила одобрение.</p>

      <div class="result-details">
        <div><span>Статус заявки</span><strong class="status">Отказано</strong></div>
        <div><span>Номер заявки</span><strong id="applicationNumber">№-000000</strong></div>
        <div><span>Дата формирования результата</span><strong id="resultDate">—</strong></div>
      </div>
      <a class="primary-btn centered" href="index.html">Вернуться к форме <span>↺</span></a>
    </div>
  </main>
  <script>
    const number = localStorage.getItem('demoApplicationNumber') || '№-000000';
    document.getElementById('applicationNumber').textContent = number;
    document.getElementById('resultDate').textContent =
      new Date().toLocaleDateString('ru-RU');
  </script>
</body>
</html>
